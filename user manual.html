<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakeRecord User Manual - Select Language</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-bg: #e0e7ff;
            --secondary-color: #3730a3;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --sub-text: #6b7280;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .app-icon {
            width: 72px;
            height: 72px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.3);
        }
        h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        p.subtitle {
            font-size: 14px;
            color: var(--sub-text);
            margin: 0 0 32px 0;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .btn-jpn {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-jpn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-eng {
            background-color: var(--secondary-bg);
            color: var(--secondary-color);
        }
        .btn-eng:hover {
            background-color: #c7d2fe;
            transform: translateY(-1px);
        }
        footer {
            margin-top: 32px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="app-icon">🍶</div>
    <h1>SakeRecord</h1>
    <p class="subtitle">User Manual / ユーザーマニュアル</p>
    
    <div class="btn-group">
        <a href="jpn.html" class="btn btn-jpn">
            🇯🇵 日本語マニュアル
        </a>
        <a href="eng.html" class="btn btn-eng">
            🇺🇸 English Manual
        </a>
    </div>

    <footer>
        &copy; 2026 SakeRecord All Rights Reserved.
    </footer>
</div>

</body>
</html>
